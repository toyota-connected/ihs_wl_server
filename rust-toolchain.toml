# Pinned to the rustc that meta-lts-mixins scarthgap/rust ships, so host and
# Yocto builds use one compiler. Stock oe-core scarthgap has 1.75.0, which
# cannot build smithay (MSRV 1.80.1); the image needs the lts-mixins layer.
[toolchain]
channel = "1.98.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
