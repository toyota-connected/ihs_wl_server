# Pinned to the oldest rustc a supported Yocto release builds with, so nothing
# newer creeps in: wrynose ships 1.94.1. master ships 1.98.1, and scarthgap
# gets 1.98.1 from meta-lts-mixins scarthgap/rust (its own 1.75.0 cannot build
# smithay, MSRV 1.80.1). Keep Cargo.toml's rust-version in step.
[toolchain]
channel = "1.94.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
