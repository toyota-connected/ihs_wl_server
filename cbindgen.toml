# Generates include/ihs_wl.h. The header is checked in; regenerate with
#   cbindgen --config cbindgen.toml --output include/ihs_wl.h
# (0.27 or newer: older releases cannot parse the crate's c"..." literals)
# and keep the diff in the same commit as the ABI change.
language = "C"
cpp_compat = true
include_guard = "IHS_WL_H_"
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
documentation_style = "c"
autogen_warning = "/* Generated by cbindgen from src/lib.rs. Do not edit. */"
header = """// SPDX-FileCopyrightText: 2026 Toyota Connected North America
// SPDX-License-Identifier: Apache-2.0"""

[export]
include = ["IhsWlResult", "IhsWlPointerKind", "IhsWlTouchKind", "IhsWlViewEvent", "IhsWlCapability", "IhsWlWindowState"]
exclude = ["Config", "Error", "Result"]

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
