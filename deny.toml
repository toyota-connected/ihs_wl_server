# cargo deny check: licenses of the crates built into the library, and
# advisories against them.

[graph]
all-features = true
exclude-dev = true

[licenses]
# Permissive only: the library ships Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"
ignore = [
    # cgmath unmaintained; smithay 0.7 depends on it, no upgrade.
    { id = "RUSTSEC-2026-0196", reason = "through smithay 0.7" },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/jwinarske/smithay"]
