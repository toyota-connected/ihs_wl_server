# Regenerate after an ABI change (clang's resource dir supplies stddef.h):
#   dart run ffigen --config ffigen.yaml \
#     --compiler-opts "-I$(clang -print-resource-dir)/include"
name: IhsWlBindings
description: Bindings for include/ihs_wl.h (generated by cbindgen from src/lib.rs).
output: lib/src/bindings.g.dart
headers:
  entry-points:
    - ../../include/ihs_wl.h
  include-directives:
    - ../../include/ihs_wl.h
compiler-opts:
  - '-std=c11'
functions:
  include:
    - 'ihs_wl_.*'
structs:
  include:
    - 'IhsWl.*'
enums:
  include:
    - 'IhsWl.*'
typedefs:
  exclude:
    - '.*'
macros:
  exclude:
    - '.*'
unnamed-enums:
  exclude:
    - '.*'
preamble: |
  // Generated by ffigen from include/ihs_wl.h. Do not edit.
  // ignore_for_file: type=lint
