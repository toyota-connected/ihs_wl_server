name: ihs_wayland_server
description: >-
  Dart side of ihs_wl_server: start the embedded Wayland server and show a
  client toplevel as an ivi-homescreen platform view.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  code_assets: '>=1.0.0 <3.0.0'
  ffi: ^2.1.0
  flutter:
    sdk: flutter
  hooks: '>=1.0.0 <3.0.0'

dev_dependencies:
  ffigen: ^19.0.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
