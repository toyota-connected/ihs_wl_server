[package]
name = "ihs_wl_server"
version = "0.1.0"
edition = "2021"
# Keep in sync with rust-toolchain.toml (meta-lts-mixins scarthgap/rust).
rust-version = "1.94.1"
license = "Apache-2.0"
description = "Embedded Wayland server (smithay) that hands client surfaces to ivi-homescreen as zero-copy platform-view layers"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The same drm-ffi smithay uses, for probing render nodes directly.
drm-ffi = "0.9"
# The same gbm-sys smithay uses: vendor_gbm imports through gbm_bo_import
# types the gbm crate does not wrap.
gbm-sys = "0.4"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
# Server code for protocols/, on smithay's wayland-server.
wayland-backend = "0.3"
wayland-scanner = "0.31"

[dependencies.smithay]
version = "=0.7.0"
default-features = false
# The module never renders -- the shell is the only compositor -- so no
# renderer_*, backend_egl or backend_vulkan. backend_drm is for the syncobj DrmDeviceFd, backend_gbm for
# SHM staging buffers only. No libinput/udev/session/winit/x11/xwayland: the
# shell owns DRM master, the session and input devices.
features = [
    "wayland_frontend",
    "desktop",
    "backend_drm",
    "backend_gbm",
]

[features]
# Serve Wayland on libwayland-server and bind an EGL display to it
# (EGL_WL_bind_wayland_display), for EGL implementations whose Wayland
# clients need that rather than linux-dmabuf. Links libwayland-server;
# loads libEGL at run time. No EGL context either way.
egl-wl-display = ["smithay/backend_egl", "smithay/use_system_lib"]

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable", "staging"] }

[profile.release]
debug = "line-tables-only"

# Until Smithay/smithay#2183 is released: DrmDeviceFd::new stops trying for DRM
# master on render nodes (0.7.0 backport).
[patch.crates-io]
smithay = { git = "https://github.com/jwinarske/smithay", rev = "e722af8222c1f9f81942af5c8cbeeb9387bf431f" }
